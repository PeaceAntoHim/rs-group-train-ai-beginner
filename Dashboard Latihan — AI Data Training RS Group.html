<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Latihan — AI Data Training RS Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141C2B; --ink-soft:#44506A; --paper:#F7F8FA; --panel:#FFFFFF;
  --rule:#CBD3DE; --rule-soft:#E4E9F0;
  --pass:#1F7A5C; --flag:#B33A3A; --review:#C8762B; --mark:#2E5EAA;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECF3; --ink-soft:#9AA7BD; --paper:#10151F; --panel:#172031;
    --rule:#2E3B52; --rule-soft:#222C3F;
    --pass:#4FB890; --flag:#E07070; --review:#E0A055; --mark:#7FA7E8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECF3; --ink-soft:#9AA7BD; --paper:#10151F; --panel:#172031;
  --rule:#2E3B52; --rule-soft:#222C3F;
  --pass:#4FB890; --flag:#E07070; --review:#E0A055; --mark:#7FA7E8;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}

/* ---- hero: the verification tally ---- */
header.hero{border-bottom:2px solid var(--ink);margin-bottom:0}
.hero-in{max-width:1180px;margin:0 auto;padding:36px 20px 26px;
  display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vw,44px);
  line-height:1.1;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);max-width:60ch;margin:0}
.tally{text-align:right;border-left:1px solid var(--rule);padding-left:28px}
.tally-fig{font-family:var(--serif);font-size:clamp(34px,6vw,56px);line-height:1;
  font-variant-numeric:tabular-nums;color:var(--pass)}
.tally-lab{font-size:13px;color:var(--ink-soft);margin-top:6px;max-width:22ch;margin-left:auto}

/* ---- department rail ---- */
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
  background:var(--paper);border-bottom:1px solid var(--rule);overflow-x:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--paper);z-index:11}
.rail-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;min-width:max-content}
.rail button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  font:inherit;font-weight:500;color:var(--ink-soft);padding:14px 14px 11px;cursor:pointer;white-space:nowrap}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.rail button:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}

/* ---- section furniture ---- */
.q{font-family:var(--serif);font-size:20px;margin:34px 0 4px;font-weight:600}
.q-note{color:var(--ink-soft);font-size:14px;margin:0 0 16px;max-width:78ch}
h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:30px 0 12px;
  padding-bottom:6px;border-bottom:1px solid var(--rule)}

/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  padding:16px 0 18px;border-bottom:1px solid var(--rule-soft)}
.f label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.f select{font:inherit;font-size:14px;padding:7px 10px;background:var(--panel);
  color:var(--ink);border:1px solid var(--rule);border-radius:3px;min-width:150px}
.f select:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.reset{font:inherit;font-size:14px;background:none;border:1px solid var(--rule);
  color:var(--ink-soft);padding:7px 14px;border-radius:3px;cursor:pointer}
.reset:hover{color:var(--ink);border-color:var(--ink-soft)}
.rowcount{margin-left:auto;font-size:13px;color:var(--ink-soft);padding-bottom:8px}

/* ---- KPI: figures on ruled lines, not cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:0;border-top:1px solid var(--rule)}
.kpi{padding:16px 18px 14px;border-bottom:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft)}
.kpi:last-child{border-right:0}
.kpi-v{font-family:var(--serif);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-l{font-size:13px;color:var(--ink-soft);margin-top:5px}
.kpi-d{font-size:12px;color:var(--ink-soft);margin-top:3px;font-style:italic}
.kpi.est .kpi-v{color:var(--review)}
.kpi.est::after{content:"estimasi";display:inline-block;font-size:11px;font-style:normal;
  color:var(--review);border:1px solid var(--review);border-radius:2px;padding:0 5px;margin-top:7px}

/* ---- charts ---- */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:30px;margin-top:8px}
.chart figcaption{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
svg{display:block;width:100%;height:auto;overflow:visible}
.bar{fill:var(--mark)}
.bar.neg{fill:var(--flag)}
.bar.alt{fill:var(--pass)}
.bar-bg{fill:var(--rule-soft)}
.axis{font-size:11px;fill:var(--ink-soft)}
.val{font-size:11px;fill:var(--ink);font-variant-numeric:tabular-nums}
.gridline{stroke:var(--rule-soft);stroke-width:1}
.spark{fill:none;stroke:var(--mark);stroke-width:2}
.sparkdot{fill:var(--mark)}

/* ---- tables ---- */
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:620px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-soft);
  padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--panel);
  position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.flagged td{background:color-mix(in srgb,var(--flag) 7%,transparent)}
.tag{display:inline-block;font-size:11px;border-radius:2px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.tag.dup{color:var(--flag)} .tag.miss{color:var(--review)} .tag.late{color:var(--flag)}
.empty{padding:26px 16px;color:var(--ink-soft);font-size:14px}

/* ---- quality + tests ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:8px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
ul.quality{list-style:none;margin:0;padding:0}
ul.quality li{padding:10px 0 10px 26px;border-bottom:1px solid var(--rule-soft);
  position:relative;font-size:14px}
ul.quality li::before{content:"!";position:absolute;left:0;top:11px;width:17px;height:17px;
  border:1px solid var(--review);color:var(--review);border-radius:50%;
  font-size:11px;font-weight:600;display:grid;place-items:center}
ol.tests{list-style:none;margin:0;padding:0;counter-reset:t}
ol.tests li{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.verdict{font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.verdict.ok{color:var(--pass)} .verdict.no{color:var(--flag)}
.tests-note{font-size:13px;color:var(--ink-soft);margin-top:12px}

/* ---- limits ---- */
.limits{margin-top:34px;border-top:2px solid var(--ink);padding-top:18px}
.limits p{font-size:14px;color:var(--ink-soft);max-width:84ch;margin:0 0 10px}
.limits strong{color:var(--ink);font-weight:600}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--ink-soft)}
@media (max-width:720px){
  .hero-in{grid-template-columns:1fr;align-items:start}
  .tally{text-align:left;border-left:0;border-top:1px solid var(--rule);padding:16px 0 0}
  .tally-lab{margin-left:0}
  .rowcount{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <div class="hero-in">
    <div>
      <h1>Enam dataset, tiga puluh pemeriksaan</h1>
      <p class="sub">Dashboard acuan untuk pelatihan AI Data &amp; Dashboard RS Group. Semua angka di halaman ini dihitung ulang di browser Anda dari keenam file CSV latihan — tidak ada nilai yang ditulis tangan. Cocokkan hasil kelompok Anda dengan halaman ini.</p>

    </div>
  </div>
</header>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const REPORT = new Date("2026-10-01T00:00:00");
const N = v => v === null || v === undefined || v === "" ? null : Number(v);
const fmt = (v, d = 0) => v === null || !isFinite(v) ? "—" :
  v.toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v === null || !isFinite(v) ? "—" : fmt(v, d) + "%";
const title = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s;
const days = (a, b) => Math.round((a - b) / 86400000);
function parseDate(s){
  if (!s) return null;
  if (s.includes("/")) { const [d, m, y] = s.split("/"); return new Date(+y, +m - 1, +d); }
  const [y, m, d] = s.split("-"); return new Date(+y, +m - 1, +d);
}
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined) return;
    n.appendChild(c && c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
};

/* ---------- charts, hand-drawn SVG ---------- */
const NS = "http://www.w3.org/2000/svg";
function svgEl(t, a){ const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; }
function barChart(rows, opts = {}){
  // rows: [{label, value, cls}]
  const W = 460, rowH = 30, padL = opts.padL || 130, padR = 56, H = rows.length * rowH + 14;
  const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const hasNeg = rows.some(r => r.value < 0);
  const max = Math.max(...rows.map(r => Math.abs(r.value)), 1);
  const plotW = W - padL - padR;
  const zero = hasNeg ? padL + plotW / 2 : padL;
  const scale = hasNeg ? (plotW / 2) / max : plotW / max;
  if (hasNeg) s.appendChild(svgEl("line", { x1: zero, y1: 4, x2: zero, y2: H - 10, class: "gridline" }));
  rows.forEach((r, i) => {
    const y = i * rowH + 8, w = Math.abs(r.value) * scale;
    const x = r.value < 0 ? zero - w : zero;
    s.appendChild(svgEl("rect", { x: padL, y, width: plotW, height: 16, class: "bar-bg", rx: 1,
      opacity: hasNeg ? 0 : .5 }));
    s.appendChild(svgEl("rect", { x, y, width: Math.max(w, 1.5), height: 16, rx: 1,
      class: "bar" + (r.value < 0 ? " neg" : r.cls ? " " + r.cls : "") }));
    const lab = svgEl("text", { x: padL - 8, y: y + 12, class: "axis", "text-anchor": "end" });
    lab.textContent = r.label; s.appendChild(lab);
    const val = svgEl("text", { x: (r.value < 0 ? x - 6 : x + w + 6), y: y + 12, class: "val",
      "text-anchor": r.value < 0 ? "end" : "start" });
    val.textContent = r.display !== undefined ? r.display : fmt(r.value, opts.dec || 0);
    s.appendChild(val);
  });
  return s;
}
function lineChart(series, labels, opts = {}){
  const W = 460, H = 180, padL = 46, padB = 26, padT = 12, padR = 10;
  const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const all = series.flatMap(x => x.values);
  const max = Math.max(...all) * 1.1, min = Math.min(0, ...all);
  const px = i => padL + (i * (W - padL - padR)) / Math.max(labels.length - 1, 1);
  const py = v => H - padB - ((v - min) / (max - min || 1)) * (H - padB - padT);
  [0, .5, 1].forEach(f => {
    const v = min + (max - min) * f, y = py(v);
    s.appendChild(svgEl("line", { x1: padL, y1: y, x2: W - padR, y2: y, class: "gridline" }));
    const t = svgEl("text", { x: padL - 7, y: y + 3.5, class: "axis", "text-anchor": "end" });
    t.textContent = fmt(v, 0); s.appendChild(t);
  });
  labels.forEach((l, i) => {
    const t = svgEl("text", { x: px(i), y: H - 8, class: "axis", "text-anchor": "middle" });
    t.textContent = l; s.appendChild(t);
  });
  series.forEach(ser => {
    const d = ser.values.map((v, i) => (i ? "L" : "M") + px(i) + " " + py(v)).join(" ");
    const p = svgEl("path", { d, class: "spark" });
    if (ser.dashed) p.setAttribute("stroke-dasharray", "4 4");
    if (ser.color) p.setAttribute("stroke", ser.color);
    s.appendChild(p);
    ser.values.forEach((v, i) => {
      const c = svgEl("circle", { cx: px(i), cy: py(v), r: 3, class: "sparkdot" });
      if (ser.color) c.setAttribute("fill", ser.color);
      s.appendChild(c);
    });
  });
  return s;
}
function legend(items){
  const d = el("div", { class: "kpi-d" });

}

function kpiRow(items){

}
function table(cols, rows, emptyMsg){
  if (!rows.length) return el("div", { class: "scroll" }, el("p", { class: "empty" }, emptyMsg || "Tidak ada baris yang cocok dengan filter ini."));
  const thead = el("tr", {}, cols.map(c => el("th", { class: c.n ? "n" : "" }, c.t)));
  const body = rows.map(r => el("tr", { class: r._flag ? "flagged" : "" },
    cols.map(c => el("td", { class: c.n ? "n" : "" }, r[c.k] === null || r[c.k] === undefined ? "—" : r[c.k]))));
  return el("div", { class: "scroll" }, el("table", {}, el("thead", {}, thead), el("tbody", {}, body)));
}
function qualityList(items){

function slsBuild(state){

  const wrAll = f.length ? c("Won") / f.length * 100 : null;
  const late = f.filter(r => r._late);
  const byRep = {};
  f.filter(r => r.outcome === "Won").forEach(r => byRep[r.sales_rep] = (byRep[r.sales_rep] || 0) + N(r.deal_value_juta));
  const byStage = {};
  f.filter(r => r.outcome === "Open").forEach(r => byStage[r.stage] = (byStage[r.stage] || 0) + N(r.deal_value_juta));
  const quality = [];
  if (!state.src) quality.push("Kategori sumber tidak konsisten di file asli: satu deal tertulis huruf kecil. Diseragamkan menjadi " + new Set(rows.map(r => r.source)).size + " kategori sebelum dihitung.");
  if (late.length) quality.push(late.length + " deal berstatus Open sudah melewati tanggal target penutupan (" + late.map(r => r.deal_id).join(", ") + ") senilai " + fmt(late.reduce((a, r) => a + N(r.deal_value_juta), 0)) + " juta. Statusnya belum diperbarui di sistem.");
  const tests = [
    { name: "Closed-won dan open pipeline tidak dijumlahkan", got: "Won " + fmt(won) + " · Open " + fmt(open), pass: state.rep || state.src || state.stage ? true : (won === 2960 && open === 4360) },
    { name: "Win rate disertai penyebutnya", got: pct(wrClosed) + " (" + c("Won") + "÷" + closed + " deal tertutup)", pass: state.rep || state.src || state.stage ? true : Math.abs(wrClosed - 61.5) < 0.1 },
    { name: "Kategori sumber setelah diseragamkan", got: new Set(rows.map(r => r.source)).size + " kategori", pass: new Set(rows.map(r => r.source)).size === 4 },
    { name: "Deal kedaluwarsa hanya yang berstatus Open", got: late.length + " deal · " + fmt(late.reduce((a, r) => a + N(r.deal_value_juta), 0)) + " juta", pass: state.rep || state.src || state.stage ? late.every(r => r.outcome === "Open") : (late.length === 4 && late.every(r => r.outcome === "Open")) },
    { name: "Pendapatan per rep hanya dari deal Won", got: Object.keys(byRep).length + " rep · total " + fmt(Object.values(byRep).reduce((a, b2) => a + b2, 0)), pass: Math.abs(Object.values(byRep).reduce((a, b2) => a + b2, 0) - won) < 0.5 }
  ];
  return {
    question: "Berapa yang sudah jadi pendapatan, dan berapa yang masih sekadar harapan?",
    note: "Closed-won, open pipeline, dan nilai deal yang kalah adalah tiga angka berbeda. Menjumlahkan ketiganya menghasilkan angka besar yang tidak berarti apa-apa.",
    filters: [{ key: "rep", label: "Sales rep", options: [...new Set(rows.map(r => r.sales_rep))].sort() },
      { key: "src", label: "Sumber lead", options: [...new Set(rows.map(r => r.source))].sort() },
      { key: "stage", label: "Stage", options: [...new Set(rows.map(r => r.stage))].sort() }],
    rowcount: f.length + " dari " + rows.length + " deal",
    kpis: [
      { value: fmt(won), label: "Closed-won revenue (juta)", detail: c("Won") + " deal menang" },
      { value: fmt(open), label: "Open pipeline (juta)", detail: c("Open") + " deal terbuka", est: true },
      { value: pct(wrClosed), label: "Win rate", detail: c("Won") + " ÷ " + closed + " deal tertutup" },
      { value: fmt(late.length), label: "Deal lewat target closing", detail: fmt(late.reduce((a, r) => a + N(r.deal_value_juta), 0)) + " juta tertahan" }
    ],
    charts: [
      { caption: "Pendapatan tertutup per sales rep (juta rupiah)", node: barChart(Object.entries(byRep).map(([k, v2]) => ({ label: k, value: v2 })).sort((a, b2) => b2.value - a.value).concat(Object.keys(byRep).length ? [] : [{ label: "—", value: 0 }]), { padL: 92 }) },
      { caption: "Nilai pipeline terbuka per stage (juta rupiah)", node: barChart(Object.entries(byStage).map(([k, v2]) => ({ label: k, value: v2, cls: "alt" })).sort((a, b2) => b2.value - a.value).concat(Object.keys(byStage).length ? [] : [{ label: "—", value: 0 }]), { padL: 110 }) },
      { caption: "Nilai deal menurut hasil akhir (juta rupiah)", node: barChart([{ label: "Won", value: won }, { label: "Open", value: open, cls: "alt" }, { label: "Lost", value: lost, cls: "neg2" }], { padL: 80 }) }
    ],
    table: table([{ k: "deal_id", t: "ID" }, { k: "sales_rep", t: "Rep" }, { k: "source", t: "Sumber" },
      { k: "stage", t: "Stage" }, { k: "deal_value_juta", t: "Nilai", n: true },
      { k: "expected_close_date", t: "Target closing" }, { k: "outcome", t: "Hasil" }, { k: "_note", t: "Catatan" }],
      f.map(r => Object.assign({}, r, { _note: r._late ? el("span", { class: "tag late" }, "lewat target") : null, _flag: r._late }))),
    quality, tests,
    limits: ["<strong>Open pipeline bukan pendapatan.</strong> Nilai deal terbuka adalah perkiraan yang dibuat sales rep, dan sebagian besar tidak akan tertutup sebesar itu.",
      "<strong>Dua versi win rate.</strong> Dengan penyebut deal tertutup angkanya " + pct(wrClosed) + "; dengan penyebut seluruh deal " + pct(wrAll) + ". Keduanya benar — yang keliru adalah menyebut angka tanpa penyebutnya.",
      "<strong>Sumber lead.</strong> Event belum menghasilkan kemenangan di periode ini, tetapi deal dari event bisa saja masih terbuka dan butuh siklus lebih panjang."],
    source: "Sumber: sales_pipeline.csv · data sintetis · tanggal pelaporan 1 Oktober 2026"
  };
}

/* ================= MARKETING ================= */
function mktBuild(state){
  const rows = DATA.marketing_campaigns.map(r => {
    const spend = N(r.spend_juta), rev = N(r.attributed_revenue_juta), clicks = N(r.clicks), leads = N(r.leads);
    return Object.assign({}, r, { _spend: spend, _rev: rev,
      _ctr: clicks / N(r.impressions) * 100, _cpc: clicks ? spend / clicks : null,
      _cpl: leads ? spend / leads : null, _cvr: leads ? N(r.conversions) / leads * 100 : null,
      _roas: rev === null ? null : spend ? rev / spend : null });
  });
  const f = rows.filter(r => !state.channel || r.channel === state.channel);
  const spend = f.reduce((a, r) => a + r._spend, 0);
  const known = f.filter(r => r._rev !== null);
  const rev = known.reduce((a, r) => a + r._rev, 0);
  const spendKnown = known.reduce((a, r) => a + r._spend, 0);
  const leads = f.reduce((a, r) => a + N(r.leads), 0);
  const conv = f.reduce((a, r) => a + N(r.conversions), 0);
  const impr = f.reduce((a, r) => a + N(r.impressions), 0);
  const clicks = f.reduce((a, r) => a + N(r.clicks), 0);
  const missing = f.filter(r => r._rev === null);
  const ch = {};
  f.forEach(r => { const c = ch[r.channel] = ch[r.channel] || { s: 0, sk: 0, rev: 0, l: 0, i: 0, c: 0 };
    c.s += r._spend; c.l += N(r.leads); c.i += N(r.impressions); c.c += N(r.clicks);
    if (r._rev !== null) { c.rev += r._rev; c.sk += r._spend; } });
  const chRows = Object.entries(ch).map(([k, v]) => ({ k, roas: v.sk ? v.rev / v.sk : null, cpl: v.l ? v.s / v.l : null, impr: v.i }));
  const quality = [];
  missing.forEach(r => quality.push("Pendapatan teratribusi kosong: " + r.campaign_id + " (" + r.channel + ", belanja " + fmt(r._spend) + " juta). Dikeluarkan dari pembilang DAN penyebut ROAS — bukan dianggap nol. Tanpa ini, ROAS " + r.channel + " akan terlihat jauh lebih rendah dari kenyataan."));
  if (missing.length) quality.push("ROAS keseluruhan dihitung dari belanja " + fmt(spendKnown) + " juta yang punya data pendapatan, bukan dari total belanja " + fmt(spend) + " juta.");
  const email = ch["Email"];
  const tests = [
    { name: "ROAS mengeluarkan baris tanpa pendapatan", got: email ? "Email " + fmt(email.rev / email.sk, 2) + " (bukan " + fmt(email.rev / email.s, 2) + ")" : "Email tidak dalam filter", pass: !email || Math.abs(email.rev / email.sk - 9) < 0.01 },
    { name: "KPI channel dihitung dari angka agregat", got: chRows.length + " channel dihitung ulang", pass: true },
    { name: "Pembagi nol tidak merusak perhitungan", got: f.filter(r => !N(r.clicks) || !N(r.leads)).length + " baris berpembagi nol", pass: f.every(r => r._cpl === null || isFinite(r._cpl)) },
    { name: "Total belanja cocok dengan SUM di file", got: fmt(spend) + " juta dari " + f.length + " campaign", pass: state.channel ? true : spend === 700 },
    { name: "ROAS keseluruhan memakai penyebut yang benar", got: fmt(rev / spendKnown, 2) + " (" + fmt(rev) + " ÷ " + fmt(spendKnown) + ")", pass: state.channel ? true : Math.abs(rev / spendKnown - 3.76) < 0.01 }
  ];
  return {
    question: "Channel mana yang paling efisien per rupiah, bukan yang paling banyak dilihat?",
    note: "Jangkauan dan efisiensi sering bergerak berlawanan. Bandingkan urutan channel menurut impressions dengan urutannya menurut biaya per lead sebelum mengambil kesimpulan.",
    filters: [{ key: "channel", label: "Channel", options: [...new Set(rows.map(r => r.channel))].sort() }],
    rowcount: f.length + " dari " + rows.length + " campaign",
    kpis: [
      { value: fmt(spend), label: "Total belanja (juta)", detail: f.length + " campaign" },
      { value: fmt(leads ? spend / leads : null, 3), label: "Biaya per lead (juta)", detail: fmt(spend) + " ÷ " + fmt(leads) + " lead" },
      { value: pct(leads ? conv / leads * 100 : null), label: "Conversion rate", detail: fmt(conv) + " ÷ " + fmt(leads) + " lead" },
      { value: fmt(spendKnown ? rev / spendKnown : null, 2), label: "ROAS", detail: missing.length ? fmt(missing.length) + " campaign tanpa data pendapatan dikeluarkan" : "seluruh campaign punya data" }
    ],
    charts: [
      { caption: "ROAS per channel", node: barChart(chRows.filter(r => r.roas !== null).map(r => ({ label: r.k, value: r.roas, cls: "alt" })).sort((a, b2) => b2.value - a.value).concat(chRows.length ? [] : [{ label: "—", value: 0 }]), { dec: 2, padL: 96 }) },
      { caption: "Biaya per lead per channel (juta rupiah)", node: barChart(chRows.filter(r => r.cpl !== null).map(r => ({ label: r.k, value: r.cpl })).sort((a, b2) => b2.value - a.value).concat(chRows.length ? [] : [{ label: "—", value: 0 }]), { dec: 3, padL: 96 }) },
      { caption: "Jangkauan per channel (impressions)", node: barChart(chRows.map(r => ({ label: r.k, value: r.impr, cls: "alt" })).sort((a, b2) => b2.value - a.value).concat(chRows.length ? [] : [{ label: "—", value: 0 }]), { padL: 96 }) }
    ],
    table: table([{ k: "campaign_id", t: "ID" }, { k: "channel", t: "Channel" }, { k: "spend_juta", t: "Belanja", n: true },
      { k: "_ctrD", t: "CTR", n: true }, { k: "_cpcD", t: "CPC", n: true }, { k: "_cplD", t: "CPL", n: true },
      { k: "_cvrD", t: "CVR", n: true }, { k: "_roasD", t: "ROAS", n: true }, { k: "_note", t: "Catatan" }],
      f.map(r => Object.assign({}, r, { _ctrD: pct(r._ctr, 2), _cpcD: fmt(r._cpc, 4), _cplD: fmt(r._cpl, 3),
        _cvrD: pct(r._cvr), _roasD: r._roas === null ? "—" : fmt(r._roas, 2),
        _note: r._rev === null ? el("span", { class: "tag miss" }, "pendapatan kosong") : null, _flag: r._rev === null }))),
    quality, tests,
    limits: ["<strong>Atribusi bukan sebab-akibat.</strong> Pendapatan teratribusi hanya menunjukkan penjualan yang dikaitkan sistem atribusi ke sebuah campaign. Sebagian pembeli mungkin tetap membeli tanpa pernah melihat iklannya.",
      "<strong>Dampak inkremental.</strong> Membuktikan bahwa sebuah channel benar-benar menambah penjualan butuh eksperimen terkontrol, bukan laporan atribusi.",
      "<strong>Periode pendek.</strong> Sepuluh campaign dalam empat bulan terlalu sedikit untuk menyimpulkan performa channel secara permanen."],
    source: "Sumber: marketing_campaigns.csv · data sintetis · nilai dalam juta rupiah"
  };
}

/* ================= BD ================= */
function bdBuild(state){
  const rows = DATA.bd_partnerships.map(r => Object.assign({}, r, {
    _est: N(r.estimated_value_juta), _p: N(r.close_probability),
    _w: N(r.estimated_value_juta) * N(r.close_probability),
    _late: r.status === "Active" && parseDate(r.expected_close_date) < REPORT,
    _noAct: r.status === "Active" && !r.next_action }));
  const f = rows.filter(r => (!state.industry || r.industry === state.industry) &&
    (!state.stage || r.stage === state.stage) && (!state.status || r.status === state.status));
  const act = f.filter(r => r.status === "Active");
  const est = act.reduce((a, r) => a + r._est, 0);
  const wt = act.reduce((a, r) => a + r._w, 0);
  const signed = f.filter(r => r.status === "Signed").reduce((a, r) => a + r._est, 0);
  const late = f.filter(r => r._late), noAct = f.filter(r => r._noAct);
  const byInd = {}; act.forEach(r => byInd[r.industry] = (byInd[r.industry] || 0) + r._w);
  const byStage = {}; act.forEach(r => byStage[r.stage] = (byStage[r.stage] || 0) + 1);
  const quality = [];
  if (noAct.length) quality.push(noAct.length + " peluang aktif tidak punya next action (" + noAct.sort((a, b2) => b2._est - a._est).map(r => r.partner_id).join(", ") + ") senilai " + fmt(noAct.reduce((a, r) => a + r._est, 0)) + " juta. Kolom kosong berarti tidak ada yang memegang langkah berikutnya, bukan berarti selesai.");
  if (late.length) quality.push(late.length + " peluang aktif sudah lewat tanggal target penutupan (" + late.map(r => r.partner_id).join(", ") + "). Tanggalnya perlu diperbarui atau peluangnya ditutup.");
  const both = f.filter(r => r._late && r._noAct);
  if (both.length) quality.push("Prioritas tertinggi: " + both.map(r => r.partner_id).join(", ") + " kena dua masalah sekaligus — lewat target dan tanpa next action.");
  quality.push("close_probability adalah penilaian subjektif tim BD, bukan hasil model statistik. Nilai weighted mewarisi ketidakpastian itu.");
  const tests = [
    { name: "Empat jenis nilai dilaporkan terpisah", got: "estimated " + fmt(est) + " · weighted " + fmt(wt) + " · signed " + fmt(signed) + " · realized tidak tersedia", pass: state.industry || state.stage || state.status ? true : (est === 23950 && Math.round(wt) === 11950 && signed === 5000) },
    { name: "Pembobotan hanya pada baris Active", got: fmt(wt, 0) + " dari " + act.length + " peluang", pass: state.industry || state.stage || state.status ? true : Math.round(wt) === 11950 },
    { name: "Kedaluwarsa tidak termasuk status Dropped", got: late.length + " peluang · " + fmt(late.reduce((a, r) => a + r._est, 0)) + " juta", pass: late.every(r => r.status === "Active") && (state.industry || state.stage || state.status ? true : late.length === 2) },
    { name: "Peluang tanpa next action terdeteksi", got: noAct.length + " peluang · " + fmt(noAct.reduce((a, r) => a + r._est, 0)) + " juta", pass: state.industry || state.stage || state.status ? true : (noAct.length === 4 && noAct.reduce((a, r) => a + r._est, 0) === 5700) },
    { name: "Realized revenue tidak dikarang", got: "dinyatakan tidak tersedia di dataset", pass: true }
  ];
  return {
    question: "Berapa nilai pipeline yang masuk akal dilaporkan, dan mana yang mandek?",
    note: "Empat angka yang tidak boleh dijumlahkan: perkiraan tim, perkiraan dikali probabilitas, nilai yang sudah diteken, dan uang yang benar-benar masuk. Yang terakhir tidak ada di dataset ini.",
    filters: [{ key: "industry", label: "Industri", options: [...new Set(rows.map(r => r.industry))].sort() },
      { key: "stage", label: "Stage", options: [...new Set(rows.map(r => r.stage))].sort() },
      { key: "status", label: "Status", options: ["Active", "Signed", "Dropped"] }],
    rowcount: f.length + " dari " + rows.length + " peluang",
    kpis: [
      { value: fmt(act.length), label: "Peluang aktif", detail: f.filter(r => r.status === "Signed").length + " diteken · " + f.filter(r => r.status === "Dropped").length + " batal" },
      { value: fmt(est), label: "Nilai perkiraan (juta)", detail: "angka yang biasa dilaporkan ke direksi", est: true },
      { value: fmt(wt, 0), label: "Setelah dibobot probabilitas (juta)", detail: "perkiraan × close_probability", est: true },
      { value: fmt(signed), label: "Sudah diteken (juta)", detail: "belum tentu sudah dibayar" }
    ],
    charts: [
      { caption: "Nilai berbobot per industri (juta rupiah)", node: barChart(Object.entries(byInd).map(([k, v]) => ({ label: k, value: v, cls: "alt" })).sort((a, b2) => b2.value - a.value).concat(Object.keys(byInd).length ? [] : [{ label: "—", value: 0 }]), { padL: 112 }) },
      { caption: "Jumlah peluang aktif per stage", node: barChart(Object.entries(byStage).map(([k, v]) => ({ label: k, value: v })).sort((a, b2) => b2.value - a.value).concat(Object.keys(byStage).length ? [] : [{ label: "—", value: 0 }]), { padL: 112 }) },
      { caption: "Perkiraan versus nilai berbobot (juta rupiah)", node: barChart([{ label: "Perkiraan", value: est }, { label: "Berbobot", value: wt, cls: "alt" }, { label: "Diteken", value: signed }], { padL: 92 }) }
    ],
    table: table([{ k: "partner_id", t: "ID" }, { k: "industry", t: "Industri" }, { k: "stage", t: "Stage" },
      { k: "estimated_value_juta", t: "Perkiraan", n: true }, { k: "close_probability", t: "Probabilitas", n: true },
      { k: "_wD", t: "Berbobot", n: true }, { k: "expected_close_date", t: "Target" },
      { k: "_act", t: "Next action" }, { k: "status", t: "Status" }],
      f.slice().sort((a, b2) => b2._w - a._w).map(r => Object.assign({}, r, { _wD: fmt(r._w, 0),
        _act: r.next_action || (r.status === "Active" ? el("span", { class: "tag miss" }, "kosong") : "—"),
        _flag: r._late || r._noAct }))),
    quality, tests,
    limits: ["<strong>Pipeline bukan proyeksi pendapatan.</strong> Nilai perkiraan dibuat tim BD sebelum negosiasi selesai, dan hampir selalu lebih besar daripada yang akhirnya ditandatangani.",
      "<strong>Probabilitas subjektif.</strong> Angka close_probability tidak berasal dari model apa pun. Dua orang bisa memberi angka berbeda untuk peluang yang sama.",
      "<strong>Uang masuk.</strong> Dataset ini tidak memuat realized revenue, jadi tidak ada cara mengetahui berapa dari nilai yang diteken sudah benar-benar dibayar."],
    source: "Sumber: bd_partnerships.csv · data sintetis · tanggal pelaporan 1 Oktober 2026"
  };
}

/* ================= wiring ================= */
const DIVS = [
  { id: "hr", name: "HR", build: hrBuild },
  { id: "fin", name: "Finance", build: finBuild },
  { id: "lgl", name: "Legal", build: lglBuild },
  { id: "sls", name: "Sales", build: slsBuild },
  { id: "mkt", name: "Marketing", build: mktBuild },
  { id: "bd", name: "Business Development", build: bdBuild }
];
const STATE = {};
DIVS.forEach(d => STATE[d.id] = {});
let current = "hr";
function render(){
  const d = DIVS.find(x => x.id === current);
  const cfg = d.build(STATE[d.id]);
  cfg.allTests = cfg.tests;
  section(cfg, STATE[d.id]);
  document.querySelectorAll("#rail button").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.id === current ? "true" : "false"));
}
function buildRail(){
  const rail = document.getElementById("rail");
  DIVS.forEach(d => {
    const b = el("button", { type: "button", role: "tab", "data-id": d.id, "aria-selected": "false" }, d.name);
    b.addEventListener("click", () => { current = d.id; render(); window.scrollTo({ top: 0, behavior: "auto" }); });
    rail.appendChild(b);
  });
}
function tally(){
  let pass = 0, total = 0;
  DIVS.forEach(d => { const cfg = d.build({}); cfg.tests.forEach(t => { total++; if (t.pass) pass++; }); });
  document.getElementById("tallyFig").textContent = pass + "/" + total;
  const lab = document.getElementById("tallyLab");
  lab.textContent = pass === total
    ? "acceptance test lolos, dihitung ulang dari file saat halaman dibuka"
    : "acceptance test lolos — " + (total - pass) + " gagal, periksa divisi yang ditandai";
  if (pass !== total) document.getElementById("tallyFig").style.color = "var(--flag)";
}
buildRail(); render(); tally();
</script>
